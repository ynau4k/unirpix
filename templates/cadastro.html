<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b102b">
  <title>Criar conta | UnirPix</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="titulo-cadastro">
      <div class="login-content">
        <a class="brand" href="{{ url_for('login') }}" aria-label="UnirPix, página de login">
          <span class="brand-mark" aria-hidden="true">♡</span>
          <span class="brand-name">Unir<span>Pix</span></span>
        </a>

        <div class="welcome-copy">
          <span class="eyebrow">Seu cantinho começa aqui</span>
          <h1 id="titulo-cadastro">Crie sua conta</h1>
          <p>Cadastre seus dados para acessar o UnirPix.</p>
        </div>

        {% if mensagem %}<div class="notice" role="status">{{ mensagem }}</div>{% endif %}

        <form id="form-cadastro" class="login-form" method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="field-group">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" type="text" autocomplete="name" required>
          </div>
          <div class="field-group">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14" required>
          </div>
          <div class="field-group">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="12" required>
            <span class="field-hint">Use pelo menos 12 caracteres.</span>
          </div>
          <div class="field-group">
            <label for="confirmacao">Confirme a senha</label>
            <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="12" required>
          </div>
          <button class="submit-button" type="submit">Criar conta <span aria-hidden="true">♡</span></button>
          <p class="form-note"><a class="text-link" href="{{ url_for('login') }}">Voltar para o login</a></p>
        </form>
      </div>

      <aside class="cat-panel" aria-label="Ilustração de uma gata preta">
        <svg class="night-sky" viewBox="0 0 420 420" aria-hidden="true">
          <path class="moon-shape" d="M264 45a86 86 0 1 0 91 126 73 73 0 0 1-91-126Z"/>
          <path class="sky-star" d="m94 94 3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8Zm241 105 2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6Z"/>
        </svg>
        <img src="{{ url_for('static', filename='imagens/gatos/gata-preta-transparente.png') }}" alt="Gata preta em perfil" class="login-cat">
        <p class="cat-caption">Um novo cantinho espera por você.</p>
      </aside>
    </section>
    <footer class="page-footer">Feito com carinho e muitos ronrons <span aria-hidden="true">♡</span></footer>
  </main>
  <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
