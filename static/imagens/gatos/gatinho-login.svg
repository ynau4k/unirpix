<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Gatinho kawaii com laço</title>
  <desc id="descricao">Um gatinho branco e rosado sentado, com bochechas coradas e um laço na cabeça.</desc>
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfd"/>
      <stop offset="1" stop-color="#ffe9f1"/>
    </linearGradient>
    <linearGradient id="laco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9fc1"/>
      <stop offset="1" stop-color="#ec6e9e"/>
    </linearGradient>
  </defs>

  <!-- Sombra suave para apoiar o personagem na cena. -->
  <ellipse cx="213" cy="370" rx="133" ry="20" fill="#e89bb5" opacity=".2"/>

  <!-- Cauda e corpo do gatinho. -->
  <path d="M302 282c52 1 64 43 42 62-17 14-40 6-41-13 0-10 8-16 17-12" fill="none" stroke="#f4c7d5" stroke-width="24" stroke-linecap="round"/>
  <path d="M111 258c-10 46 6 104 50 112h112c40-11 50-59 39-105" fill="url(#corpo)" stroke="#eec8d6" stroke-width="5"/>
  <ellipse cx="222" cy="329" rx="49" ry="46" fill="#fff" opacity=".7"/>

  <!-- Orelhas e rosto. -->
  <path d="m109 110 5-75c1-14 17-20 28-10l52 48m16 1 56-48c12-10 29-2 28 13l-4 78" fill="url(#corpo)" stroke="#eec8d6" stroke-width="5" stroke-linejoin="round"/>
  <path d="m127 98 3-43c1-7 7-9 13-4l37 33m50-1 39-34c5-5 12-2 11 5l-3 46" fill="#f5adc5"/>
  <path d="M103 139c0-59 48-101 112-101s111 42 111 101v71c0 63-48 101-111 101s-112-38-112-101z" fill="url(#corpo)" stroke="#eec8d6" stroke-width="5"/>

  <!-- Laço delicado no topo da cabeça. -->
  <path d="M261 48c-20-28-56-30-69-18-13 13 3 45 29 54 18 7 38-10 40-36Zm-4 2c21-27 57-26 69-12 12 14-7 45-33 52-19 5-37-13-36-40Z" fill="url(#laco)" stroke="#dc5e8d" stroke-width="4"/>
  <circle cx="258" cy="51" r="12" fill="#ffd8e5" stroke="#dc5e8d" stroke-width="4"/>

  <!-- Olhos, focinho, bigodes e bochechas. -->
  <ellipse cx="166" cy="174" rx="8" ry="12" fill="#59404b"/>
  <ellipse cx="264" cy="174" rx="8" ry="12" fill="#59404b"/>
  <circle cx="169" cy="170" r="2.5" fill="#fff"/>
  <circle cx="267" cy="170" r="2.5" fill="#fff"/>
  <ellipse cx="139" cy="200" rx="19" ry="10" fill="#ffb6cd" opacity=".75"/>
  <ellipse cx="291" cy="200" rx="19" ry="10" fill="#ffb6cd" opacity=".75"/>
  <path d="m207 190 8 6 8-6c1 9-3 14-8 14s-9-5-8-14Z" fill="#e97e9f"/>
  <path d="M215 204c-2 9-12 12-18 6m18-6c2 9 12 12 18 6" fill="none" stroke="#59404b" stroke-width="4" stroke-linecap="round"/>
  <path d="m137 188-43-8m44 19-44 4m184-15 43-8m-43 19 44 4" fill="none" stroke="#d8a6b7" stroke-width="3" stroke-linecap="round"/>

  <!-- Patinhas e pequeno coração na barriga. -->
  <path d="M147 340c-5 15 2 26 19 26h28c14-1 17-10 11-24m22 0c-7 14-4 23 10 24h28c17 0 24-11 19-26" fill="#fff" stroke="#eec8d6" stroke-width="4"/>
  <path d="M214 292c-8-10-21 2 0 18 21-16 8-28 0-18Z" fill="#f28aac"/>

  <!-- Brilhinhos decorativos. -->
  <path d="M63 131v22m-11-11h22M347 226v20m-10-10h20M91 294v16m-8-8h16" stroke="#f29bb7" stroke-width="4" stroke-linecap="round"/>
  <path d="m345 103 4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9Z" fill="#f6b5ca"/>
</svg>
